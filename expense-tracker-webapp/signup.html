<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker — Sign Up</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Create Account</h1>
    <p class="sub">Sign up for the User module</p>
    <form id="signupForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required minlength="4">
      </div>
      <div class="field">
        <label for="confirm">Confirm Password</label>
        <input type="password" id="confirm" required minlength="4">
      </div>
      <div class="formErr" id="formErr"></div>
      <button type="submit" class="primary">Sign Up</button>
    </form>
    <p class="switch">Already have an account? <a href="index.html">Log in</a></p>
  </div>
</div>
<script src="js/common.js"></script>
<script src="js/signup.js"></script>
</body>
</html>
