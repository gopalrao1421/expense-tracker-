<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Expense Tracker — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Expense Tracker</h1>
    <p class="sub">Log in to continue</p>
    <form id="loginForm">
      <div class="field">
        <label for="username">Username</label>
        <input type="text" id="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required>
      </div>
      <div class="formErr" id="formErr"></div>
      <button type="submit" class="primary">Log In</button>
    </form>
    <p class="switch">New here? <a href="signup.html">Create an account</a></p>
    <p class="hint">Admin demo login — username: <strong>admin</strong>, password: <strong>admin123</strong></p>
  </div>
</div>
<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
